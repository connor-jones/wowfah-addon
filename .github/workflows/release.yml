# Push a tag such as v0.6.0 to publish a release. The addon is uploaded to GitHub Releases, and to CurseForge
# and Wago once their project ids are in the .toc and their API keys are saved as repository secrets.
name: release
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit
          luajit tests/run.lua
      - uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
